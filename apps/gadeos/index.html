<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#100b09">
  <title>GADEOS · Tu alianza</title>
  <link rel="stylesheet" href="/private-app-assets/gadeos/style.css">
  <script type="module" src="/private-app-assets/gadeos/app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M13 2c2 6-4 6-1 11 1-2 3-3 4-5 5 6 4 13-4 14C3 22 1 14 7 9c0 4 2 5 3 5C7 8 13 6 13 2Z"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="5" r="3"/><circle cx="18" cy="19" r="3"/><path d="M6 8c0 8 12 0 12 8M14 3h6m-3-3v6"/></symbol>
    <symbol id="i-battle" viewBox="0 0 24 24"><path d="m4 3 7 5-3 3Zm16 0-7 5 3 3ZM8 11l12 11M16 11 4 22M2 17l5 5m15-5-5 5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L21 5"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="m12 6 3 5-3 5-3-5Zm-3 13h6"/></symbol>
  </defs></svg>
  <main id="login-screen" class="login-screen">
    <div class="login-art" aria-hidden="true"><div class="fire-ring"><svg><use href="#i-flame"/></svg></div><span class="art-caption">OCHO PRUEBAS · UNA ALIANZA</span></div>
    <section class="login-panel"><p class="eyebrow">JUEGOS DEL HAMBRE EN CHINCHÓN</p><h1>GADEOS</h1><p class="muted">Vuestro viaje empieza aquí.</p>
      <form id="login-form"><label>Nombre de tributo<input name="name" autocomplete="username" minlength="2" maxlength="80" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required></label><button class="primary" type="submit">Entrar en la arena <span aria-hidden="true">↗</span></button><p id="login-error" class="error" role="alert" hidden></p></form>
    </section>
  </main>
  <div id="game-screen" class="game-shell" hidden>
    <header class="app-header"><a href="#inicio" class="brand" aria-label="GADEOS, inicio"><svg aria-hidden="true"><use href="#i-flame"/></svg><strong>GADEOS</strong></a><button id="logout" class="quiet" type="button" aria-label="Cerrar sesión">Salir ↗</button></header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Secciones"><a href="#inicio"><svg><use href="#i-flame"/></svg><span>Inicio</span></a><a href="#recorrido"><svg><use href="#i-route"/></svg><span>Recorrido</span></a><a href="#batalla"><svg><use href="#i-battle"/></svg><span>Batalla final</span></a></nav>
  </div>
  <dialog id="challenge" aria-labelledby="challenge-title"><button class="close" type="button" aria-label="Cerrar prueba">×</button><div id="challenge-content"></div></dialog>
  <dialog id="reward" aria-labelledby="reward-title"><button class="close" type="button" aria-label="Cerrar sobre">×</button><div id="reward-content"></div></dialog>
  <p id="notice" class="notice" role="status" hidden></p>
</body></html>
