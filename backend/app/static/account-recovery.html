<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Recuperar acceso · Profesor Particular</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font:16px/1.6 "Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at top,#dceeff,#f7fbff 70%);color:#132958}main{width:min(100%,490px);padding:32px;border:1px solid #dce8f8;border-radius:24px;background:white;box-shadow:0 20px 60px #143b6918}img{width:58px;height:58px}h1{font-size:27px;line-height:1.2}p{color:#526c8e}label{display:block;font-weight:600;font-size:14px;margin-top:18px}input{width:100%;padding:12px;margin:6px 0;border:1px solid #bcd3ed;border-radius:10px;font:inherit}button{width:100%;padding:13px;margin-top:22px;background:#0969eb;color:white;border:0;border-radius:12px;font:600 16px "Segoe UI",Arial;cursor:pointer}button:disabled{opacity:.6}a{color:#0864d5}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #3698ff;outline-offset:3px}[hidden]{display:none!important}.status{padding:12px;border-radius:10px;background:#edf5ff;overflow-wrap:anywhere}.error{background:#fff1f1;color:#9a203c}</style></head>
<body><main><a href="/profesor"><img src="/assets/brand/profesor-simple-v2.png" alt="Profesor Particular"></a><h1 id="title">Recuperar acceso</h1><p id="copy">Solicita un enlace para recuperar tu contraseña o verificar tu correo. Tus materiales y fichas se conservan.</p>
<form id="accountForm"><div id="emailFields"><label for="email">Correo de la cuenta</label><input type="email" id="email" maxlength="255" autocomplete="username" required></div><div id="passwordFields" hidden><label for="password">Elige tu contraseña</label><input type="password" id="password" minlength="8" maxlength="72" autocomplete="new-password"><label for="confirm">Repite la contraseña</label><input type="password" id="confirm" minlength="8" maxlength="72" autocomplete="new-password"></div><p id="status" class="status" role="status" hidden></p><button id="submit">Enviar enlace</button></form><p><a href="/profesor/login">Volver a iniciar sesión</a></p><p>¿Necesitas ayuda? <a href="mailto:educamesuite@gmail.com">Contactar con soporte</a></p></main>
<script>const params=new URLSearchParams(location.hash.slice(1)),action=params.get('action'),token=params.get('token');history.replaceState(null,'',location.pathname);const completing=Boolean(token&&['verify','reset'].includes(action));if(completing){document.getElementById('title').textContent=action==='verify'?'Verifica y protege tu cuenta':'Elige una contraseña nueva';document.getElementById('copy').textContent='Elige una contraseña que solo tú conozcas. Se cerrarán las sesiones anteriores sin borrar tu información.';document.getElementById('emailFields').hidden=true;document.getElementById('email').required=false;document.getElementById('passwordFields').hidden=false;document.getElementById('password').required=true;document.getElementById('confirm').required=true;document.getElementById('submit').textContent=action==='verify'?'Verificar y guardar contraseña':'Guardar contraseña'}document.getElementById('accountForm').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status');status.hidden=false;status.classList.remove('error');if(completing&&document.getElementById('password').value!==document.getElementById('confirm').value){status.textContent='Las contraseñas no coinciden.';return}button.disabled=true;try{const response=await fetch(completing?'/auth/account/'+(action==='verify'?'verify':'reset-password'):'/auth/account/request-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(completing?{token,new_password:document.getElementById('password').value}:{email:document.getElementById('email').value.trim()})}),data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'No se pudo completar la solicitud.');status.textContent=data.message;if(completing){document.getElementById('passwordFields').hidden=true;button.hidden=true}}catch(error){status.classList.add('error');status.textContent=error.message||'No hay conexión. Vuelve a intentarlo.'}finally{button.disabled=false}};</script></body></html>
