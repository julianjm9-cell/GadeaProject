<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mi aplicación</title><link rel="stylesheet" href="/private-app-assets/private-workspace/style.css"><script type="module" src="/private-app-assets/private-workspace/app.js"></script></head><body><main><section id="access"><p class="eyebrow">TU ESPACIO</p><h1>Bienvenido</h1><p>Entra con la cuenta que te ha facilitado la persona que administra esta aplicación.</p><form id="login"><label>Nombre<input name="name" autocomplete="username" minlength="2" maxlength="80" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required></label><button>Entrar</button><button id="register" type="button" hidden>Crear cuenta</button></form></section><section id="workspace" hidden><header><h1 id="title"></h1><button id="logout" type="button">Salir</button></header><nav><a href="#inicio">Inicio</a><a href="#espacio">Mi espacio</a></nav><section id="home"><h2 id="greeting"></h2><p>Tu aplicación ya tiene acceso por cuenta y un espacio personal que se guarda entre dispositivos.</p><a href="#espacio">Abrir mi espacio →</a></section><form id="notes" hidden><label>Mi espacio<textarea name="text" maxlength="5000" rows="12" placeholder="Guarda aquí tus ideas y notas."></textarea></label><button>Guardar</button></form></section><p id="message" role="status"></p></main></body></html>
