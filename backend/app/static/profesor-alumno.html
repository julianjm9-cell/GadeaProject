<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi clase · Profesor Particular</title><link rel="icon" href="/assets/brand/profesor-simple-v2.png"><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0d2451;background:#eef7ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 80% 8%,#d7ebff,transparent 40%),#eef7ff}button,.button{font:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px max(24px,calc((100vw - 1120px)/2));background:#fff;border-bottom:1px solid #dce9f8}.brand{display:flex;align-items:center;gap:10px;font-weight:850;line-height:1.1;color:#0b2154}.brand img{width:44px;height:44px;object-fit:contain}.logout{padding:10px 14px;border-radius:10px;border:1px solid #d2e2f8;background:#fff;color:#174f99;font-weight:700}main{max-width:1120px;margin:0 auto;padding:56px 24px}.eyebrow{color:#1172e7;font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.welcome{display:grid;gap:7px;margin-bottom:30px}.welcome h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:0}.welcome p{margin:0;color:#5b74a1;font-size:17px}.card{background:#fff;border:1px solid #dce8f8;border-radius:22px;box-shadow:0 15px 45px #2a71a014;padding:30px;max-width:760px}.card-top{display:flex;align-items:center;gap:14px;padding-bottom:22px;border-bottom:1px solid #e3edf9}.video-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#e8f3ff;color:#0b72e9;font-size:27px}.card h2{margin:0;font-size:24px}.card small{display:block;color:#6780a5;margin-top:5px}.meeting{padding-top:20px}.meeting p{color:#59739d;line-height:1.6}.button{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:14px 22px;background:#096ef0;color:#fff;font-weight:750;box-shadow:0 7px 18px #0c6df025}.meeting-link{overflow-wrap:anywhere;margin:15px 0;color:#36669c}.empty{padding:15px 18px;border-radius:12px;background:#f1f7ff;color:#53739d}.refresh{margin-top:24px;padding:10px 0;border:0;background:transparent;color:#096de8;font-weight:700}.error{color:#b83323}footer{margin-top:40px;color:#7a8eae;font-size:13px}@media(max-width:600px){header{padding:12px 16px}main{padding:32px 16px}.card{padding:22px}.welcome p{font-size:15px}}
</style></head><body><header><div class="brand"><img src="/assets/brand/profesor-simple-v2.png" alt=""><span>Profesor<br>Particular</span></div><button class="logout" id="logout">Cerrar sesión</button></header><main><div class="welcome"><span class="eyebrow">Mi espacio de clase</span><h1 id="greeting">Bienvenido</h1><p id="subtitle">Cargando tu espacio…</p></div><section class="card"><div class="card-top"><span class="video-icon" aria-hidden="true">▣</span><div><h2>Tu videollamada</h2><small>Google Meet</small></div></div><div class="meeting" id="meeting" aria-live="polite"><p>Comprobando el enlace…</p></div><button class="refresh" id="refresh">Actualizar enlace</button></section><footer>El enlace lo comparte tu profesor. Puedes volver a esta pantalla desde cualquier dispositivo con tu usuario y contraseña.</footer></main><script>
const $=id=>document.getElementById(id);const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lastLink='';
async function load(){try{const response=await fetch('/auth/profesor/student-me',{credentials:'same-origin',cache:'no-store'});if(response.status===401||response.status===403){location.replace('/profesor/login?expired=1');return}if(!response.ok)throw Error('No se pudo cargar tu espacio.');const data=await response.json();$('greeting').textContent='Hola, '+data.student.name;$('subtitle').textContent=data.student.course+' · Clases con '+data.teacher.name;const link=data.meet_uri||'';if(link!==lastLink){$('meeting').innerHTML=link?`<p>Tu profesor ya ha preparado el enlace de clase.</p><a class="button" href="${safe(link)}" target="_blank" rel="noopener noreferrer">Entrar a la videollamada ↗</a><p class="meeting-link">${safe(link)}</p>`:'<p class="empty">Todavía no hay una videollamada compartida. Cuando tu profesor añada el enlace, aparecerá aquí automáticamente.</p>';lastLink=link}}catch(err){$('meeting').innerHTML='<p class="error">No hay conexión en este momento. Pulsa «Actualizar enlace» para reintentar.</p>'}}$('refresh').onclick=load;$('logout').onclick=async()=>{await fetch('/auth/profesor/student-logout',{method:'POST',credentials:'same-origin'});location.replace('/profesor/login')};document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden)load()},20000);load();
</script></body></html>
