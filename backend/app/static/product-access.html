<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#0c1747;background:radial-gradient(ellipse at 90% 10%,#d8edff,transparent 55%),radial-gradient(ellipse at 0 80%,#dff1ff,transparent 55%),#f7fbff}a{color:#0065ff}button,input{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #519bff;outline-offset:3px}[hidden]{display:none!important}main{max-width:1160px;min-height:100svh;margin:auto;padding:28px 36px;display:grid;grid-template-columns:1.2fr 1fr;gap:55px;align-items:center}.intro h1{font-size:clamp(32px,3.4vw,47px);letter-spacing:-1.8px;line-height:1.06;margin:0 0 16px;max-width:510px}.intro h1 span{color:#0065ff;display:block}.intro p{font-size:16px;line-height:1.6;color:#7183ab;max-width:460px;margin:0 0 24px}.access-card{padding:30px;background:#ffffffed;border:1px solid white;border-radius:24px;box-shadow:0 18px 50px #1f61930b}.form-brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:15px;margin-bottom:21px}.form-brand img,.form-brand svg{width:34px;height:34px}.form-brand svg{color:#1267ee}h2{font-size:28px;letter-spacing:-.8px;line-height:1.1;margin:0 0 8px}.form-copy{font-size:14px;color:#7183ab;line-height:1.5;margin:0 0 18px}label{font-size:12px;font-weight:650;display:block;margin:12px 0 6px}input{width:100%;height:42px;border:1px solid #dce7f8;border-radius:9px;padding:10px 12px;color:#172b50;background:white;font-size:14px}input::placeholder{color:#93a3bc}.password-field{position:relative}.password-field input{padding-right:65px}.reveal{position:absolute;right:6px;top:5px;height:32px;border:0;background:transparent;color:#607eab;font-size:11px;cursor:pointer}.submit{width:100%;border:0;border-radius:10px;padding:13px;min-height:44px;background:linear-gradient(120deg,#0091ff,#0060ff);color:white;font-weight:700;margin-top:19px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.switch{text-align:center;font-size:12px;color:#7485a5;margin:20px 0}.switch a{font-weight:650}.back{text-align:center;border-top:1px solid #edf2fa;padding-top:16px;margin:17px 0 0;font-size:12px}.back a{text-decoration:none}.error{font-size:13px;color:#b62e45;line-height:1.4;margin-top:10px}.error:empty{display:none}.google-button{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;border:1px solid #dce7f8;border-radius:10px;text-align:center;padding:10px;text-decoration:none;font-size:14px;font-weight:650;margin:14px 0;background:white;color:#172b50;transition:border-color .2s,box-shadow .2s}.google-button:hover{border-color:#a9c8f2;box-shadow:0 4px 14px #1f61931a}.google-mark{font-size:19px;font-weight:800;line-height:1;background:conic-gradient(#4285f4 0 90deg,#34a853 90deg 180deg,#fbbc05 180deg 270deg,#ea4335 270deg);-webkit-background-clip:text;background-clip:text;color:transparent}.divider{text-align:center;font-size:11px;color:#92a0b7}.conditions{font-size:11px;color:#7688aa;margin-top:12px}.conditions summary{cursor:pointer}.conditions p{line-height:1.5}.devices{position:relative;margin:32px 0 0;padding-bottom:25px}.laptop{width:90%}.laptop-screen{aspect-ratio:1.55;border:8px solid #252a33;border-radius:18px 18px 5px 5px;overflow:hidden;background:#edf6ff}.laptop-screen img{width:100%;height:100%;object-fit:cover;object-position:top}.laptop-base{height:13px;background:linear-gradient(#e3e6eb,#8c96a5);border-radius:0 0 50% 50%;margin:0 -5%;box-shadow:0 10px 15px #234a7722}.phone{position:absolute;right:0;top:15px;width:26%;aspect-ratio:.46;border:5px solid #252a33;border-radius:25px;overflow:hidden;background:#eaf5ff;box-shadow:0 12px 25px #234a7725}.phone img{width:100%;height:100%;object-fit:cover;object-position:top}.phone:before{content:"";position:absolute;left:25%;top:0;width:50%;height:8px;background:#252a33;border-radius:0 0 9px 9px}@media(min-width:761px) and (max-height:800px){main{padding:16px 30px;gap:40px}.access-card{padding:23px 28px}.form-brand{margin-bottom:16px}.form-copy{margin-bottom:12px}.switch{margin:14px 0}.back{margin-top:12px;padding-top:12px}.intro h1{font-size:39px}.intro p{font-size:15px}.devices{margin-top:20px}}@media(max-width:760px){main{grid-template-columns:1fr;gap:22px;padding:26px 20px;max-width:520px}.intro h1{font-size:32px;letter-spacing:-1px;margin-bottom:9px}.intro p{font-size:14px;margin-bottom:0}.intro .devices{display:none}.access-card{padding:25px}.form-brand{margin-bottom:17px}}.diplomator-access{color:#172026;background:radial-gradient(ellipse at 85% 20%,#e6edf8,transparent 60%),radial-gradient(ellipse at 0 85%,#f2ead7,transparent 60%),#f6f7f4}.diplomator-access .intro h1{font-family:Georgia,serif;font-weight:600;letter-spacing:-1.6px}.diplomator-access .intro h1 span,.diplomator-access a{color:#2454a6}.diplomator-access .intro p,.diplomator-access .form-copy{color:#667584}.diplomator-access .submit{background:linear-gradient(120deg,#254c82,#172b45)}.diplomator-access .access-card{border-color:#dce3e7}.diplomator-access .form-brand{padding-bottom:17px;border-bottom:1px solid #e7d5b2}.diplomator-access .laptop-screen,.diplomator-access .phone{background:#f6f7f4}@media(min-width:761px) and (max-height:800px){.access-card{padding-top:20px;padding-bottom:20px}.form-brand{margin-bottom:10px}.google-button{padding:8px;margin:8px 0}label{margin-top:10px}}
</style><style>.facturas-access{background:radial-gradient(ellipse at 87% 10%,#d9f5f2,transparent 55%),radial-gradient(ellipse at 0 85%,#e2f4ff,transparent 55%),#f8fcff;color:#102844}.facturas-access .intro h1 span,.facturas-access a{color:#078b91}.facturas-access .submit{background:linear-gradient(120deg,#12b5a6,#087e95)}.facturas-access .access-card{border-color:#dcece9}.facturas-access .form-brand{padding-bottom:17px;border-bottom:1px solid #e2eeef}.facturas-access .laptop-screen,.facturas-access .phone{background:#f4fafb}</style><script>(()=>{const path=location.pathname,next=new URLSearchParams(location.search).get('next')||'';const name=path.startsWith('/facturas/')||next==='/facturas'?'facturas':path.startsWith('/profesor/')||next==='/profesor-particular'?'profesor':path.startsWith('/diplomator/')||next==='/app'?'diplomator':'eso';for(const rel of ['icon','shortcut icon','apple-touch-icon']){const icon=document.createElement('link');icon.rel=rel;icon.type=name==='facturas'?'image/svg+xml':'image/png';if(rel==='icon')icon.sizes='any';icon.href=name==='facturas'?'/assets/brand/facturas.svg':'/assets/brand/'+name+'-simple-v2.png?v=20260928-3';document.head.append(icon);}})();</script></head><body><main><section class="intro"><h1 id="introTitle"></h1><p id="introCopy"></p><div id="devicePreview"></div></section><section class="access-card"><div class="form-brand" id="brand"></div><h2 id="formTitle"></h2><p class="form-copy" id="formCopy"></p><form onsubmit="login(event)"><a class="google-button" id="googleLogin" hidden><span class="google-mark" aria-hidden="true">G</span>Continuar con Google</a><div class="divider" hidden>o</div><div id="signupFields" hidden><label for="fullName">Tu nombre</label><input id="fullName" maxlength="200" autocomplete="name" placeholder="Tu nombre"></div><label for="email" id="emailLabel">Usuario o email</label><input id="email" maxlength="255" autocomplete="username" placeholder="Tu usuario o email" required><label for="password">Contraseña</label><div class="password-field"><input id="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"><button class="reveal" type="button" aria-label="Mostrar contraseña" onclick="reveal(this)">Mostrar</button></div><div id="signupConfirm" hidden><label for="confirmPassword">Repite la contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repite tu contraseña"></div><div class="error" id="error" role="alert"></div><button class="submit" id="submitButton">Entrar</button></form><p class="switch" id="switch"></p><details class="conditions" id="conditions" hidden><summary>Condiciones del acceso gratuito</summary><p id="allowance"></p></details><p class="back"><a id="back">← Volver a la web</a></p></section></main><script>const LOGIN_TARGETS={'/facturas/login':'/facturas','/diplomator/login':'/app','/e25/login':'/eso-adultos','/e25/register':'/eso-adultos','/profesor/login':'/profesor-particular','/profesor/register':'/profesor-particular'};
const requested=new URLSearchParams(location.search).get('next');const target=LOGIN_TARGETS[location.pathname]||(['/eso-adultos','/profesor-particular','/app','/facturas'].includes(requested)?requested:'/eso-adultos');
const diplomator=target==='/app';
const teacher=target==='/profesor-particular',facturas=target==='/facturas',base=facturas?'/ocr-facturas':diplomator?'/diplomator':teacher?'/profesor':'/e25',product=facturas?'Lector Facturas':diplomator?'Diplomator':teacher?'Profesor Particular':'ESO Adultos',asset=facturas?'facturas':diplomator?'diplomator':teacher?'profesor':'eso';
let signupMode=!diplomator&&!facturas&&(location.pathname.endsWith('/register')||new URLSearchParams(location.search).get('mode')==='register');
document.body.classList.toggle('diplomator-access',diplomator);
document.body.classList.toggle('facturas-access',facturas);
function nextPath(){return target}function reveal(b){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Mostrar':'Ocultar';b.setAttribute('aria-label',b.textContent+' contraseña')}
document.title=product+' | '+(signupMode?'Registro':'Acceso');
document.getElementById('introTitle').innerHTML=facturas?'Escanea, revisa y <span>organiza tus facturas.</span>':diplomator?'Ideas claras.<span>Una voz segura.</span>':teacher?'Tus clases, <span>más simples</span>':'Accede a tu <span>espacio de estudio</span>';
document.getElementById('introCopy').textContent=facturas?'Organiza clientes, revisa datos extraídos, entrena proveedores y exporta. Continúa donde lo dejaste.':diplomator?'Temas, guiones y práctica oral en inglés y francés. Retoma tu preparación desde donde la dejaste.':teacher?'Tus alumnos, materiales y próximas clases en un mismo lugar.':'Todas las herramientas de ESO Adultos en un mismo lugar: asignaturas, exámenes y seguimiento de tu progreso.';
document.getElementById('brand').innerHTML=(facturas?'<img src="/assets/brand/facturas.svg" alt="">':diplomator?'<img src="/assets/brand/diplomator-simple-v2.png" alt="">':teacher?'<img src="/assets/brand/profesor-simple-v2.png" alt="">':'<img src="/assets/brand/eso-simple-v2.png" alt="">')+product;
document.getElementById('devicePreview').innerHTML=`<figure class="devices" aria-label="${product} en ordenador y móvil"><div class="laptop"><div class="laptop-screen"><img src="/assets/landing/${asset}-dashboard.png?v=real-brand4" alt="Escritorio de ${product}"></div><div class="laptop-base"></div></div><div class="phone"><img src="/assets/landing/${asset}-mobile.png?v=real-brand4" alt="${product} en móvil"></div></figure>`;
document.getElementById('formTitle').textContent=signupMode?'Crear cuenta gratis':'Iniciar sesión';document.getElementById('formCopy').textContent=signupMode?'Empieza con tu nombre, email y contraseña.':'Entra con tu cuenta para continuar.';
for(const id of ['signupFields','signupConfirm'])document.getElementById(id).hidden=!signupMode;
document.getElementById('fullName').required=signupMode;document.getElementById('confirmPassword').required=signupMode;document.getElementById('email').type=signupMode?'email':'text';document.getElementById('password').minLength=signupMode?8:1;document.getElementById('password').autocomplete=signupMode?'new-password':'current-password';document.getElementById('submitButton').textContent=signupMode?'Crear cuenta y empezar':'Entrar';document.getElementById('submitButton').disabled=signupMode;
document.getElementById('switch').innerHTML=signupMode?`¿Ya tienes cuenta? <a href="${base}/login">Iniciar sesión</a>`:`¿Aún no tienes cuenta? <a href="${base}/register">Crear cuenta gratis</a>`;document.getElementById('back').href=base;if(diplomator||facturas){document.getElementById('switch').innerHTML='';document.getElementById('switch').hidden=true;document.getElementById('formCopy').textContent=facturas?'Accede con tu cuenta autorizada para Lector Facturas.':'Accede con tu cuenta y tu licencia de Diplomator.'}
const params=new URLSearchParams(location.search),error=document.getElementById('error');if(params.has('expired'))error.textContent='Tu sesión ha caducado. Vuelve a entrar.';if(params.has('google_disabled'))error.textContent='El acceso con Google estará disponible cuando se complete la configuración. Usa tu email y contraseña.';else if(params.get('google_error')==='account')error.textContent='Esta cuenta ya está vinculada a otro perfil de Google. Entra con tu email y contraseña.';else if(params.get('google_error')==='access')error.textContent='Tu cuenta no tiene acceso activo a esta aplicación o el registro está cerrado.';else if(params.has('google_error'))error.textContent='No se pudo acceder con Google. Inténtalo de nuevo o usa tu email y contraseña.';
if(!diplomator&&!facturas)fetch('/auth/'+(teacher?'profesor':'eso')+'/signup-settings').then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>{if(!s.enabled){if(signupMode){error.textContent='El registro está cerrado temporalmente. Puedes iniciar sesión con tu cuenta.'}else document.getElementById('switch').hidden=true;return}if(signupMode){document.getElementById('submitButton').disabled=false;document.getElementById('conditions').hidden=false;document.getElementById('allowance').textContent=`Incluye ${s.days} días de acceso y ${s.credits} créditos iniciales de IA, una sola vez por cuenta. No se renuevan automáticamente.`}}).catch(()=>{if(signupMode)error.textContent='No se pudo comprobar el registro. Recarga la página para intentarlo de nuevo.'});
if(!diplomator&&!facturas)fetch('/auth/google/status').then(r=>r.ok?r.json():{enabled:false}).then(s=>{if(s.enabled){const a=document.getElementById('googleLogin');a.href='/auth/google/login?next='+encodeURIComponent(target);a.hidden=false;document.querySelector('.divider').hidden=false}}).catch(()=>{});
async function login(event) {
  event.preventDefault();
  const error = document.getElementById('error');
  error.textContent = '';
  if (signupMode && document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
    error.textContent = 'Las contraseñas no coinciden.'; return;
  }
  const button = document.getElementById('submitButton');
  button.disabled = true;
  try {
  const body = signupMode ? {email:document.getElementById('email').value.trim(),full_name:document.getElementById('fullName').value.trim(),password:document.getElementById('password').value} : {identifier:document.getElementById('email').value.trim(),password:document.getElementById('password').value,enroll_eso:nextPath() === '/eso-adultos',enroll_profesor:nextPath() === '/profesor-particular'};
  const res = await fetch(signupMode ? (nextPath() === '/profesor-particular' ? '/auth/profesor/register' : '/auth/eso/register') : '/auth/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) {
    error.textContent = typeof data.detail === 'string' ? data.detail : 'Revisa los datos introducidos.';
    return;
  }
  if (nextPath() === '/facturas') {
    const access = await fetch('/facturas/legacy/api/auth/me', {credentials:'same-origin'});
    if (!access.ok) {
      error.textContent = access.status === 403
        ? 'Esta cuenta no tiene acceso a FACTURAS. Pide al administrador que la añada desde el dashboard.'
        : 'No se pudo comprobar el acceso a FACTURAS. Inténtalo de nuevo.';
      return;
    }
  }
  location.href = nextPath();
  } catch (_) { error.textContent = 'No se pudo conectar. Prueba de nuevo.'; }
  finally { button.disabled = false; }
}
</script>
