 const brief=learningSummary(s,subject),next=upcoming(s.id).find(c=>c.date>=localDay()),end=next?new Date(new Date(next.date).getTime()+next.duration*60000):null;
 const nextDate=next?new Date(next.date).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}):'Por programar';
 const nextTime=next?`${next.date.slice(11,16)} – ${end.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`:'';
 const tasks=state.tasks.filter(t=>t.studentId===s.id).sort((a,b)=>Number(a.done)-Number(b.done)||String(a.due||'9999').localeCompare(String(b.due||'9999'))).slice(0,4);
 const history=state.sessions.filter(c=>c.studentId===s.id&&(c.status==='Finalizada'||c.date<new Date().toISOString().slice(0,16))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
 const edit=(action,label)=>`<button class="student-overview-edit" data-action="${action}" data-id="${esc(s.id)}" aria-label="Editar ${label}">✎</button>`;
  return `<div class="student-overview" data-mobile-section="${studentOverviewPanel}">

  <div class="student-overview-hero"><div class="student-overview-identity">${avatar(s)}<div><h1>${esc(s.name)}</h1><p>${esc(s.course)}${s.subjects.includes('Español')?' · Español '+spanishLevel(s):''}</p><div class="subject-tags">${s.subjects.map(x=>`<button class="badge ${subjectColor(x)} ${x===subject?'active':''}" data-action="studentSubject" data-id="${esc(x)}" aria-pressed="${x===subject}">${esc(x)}</button>`).join('')}</div></div></div><div class="student-overview-stat goal"><div class="student-overview-stat-head">${icon('check')}<strong>Objetivo principal</strong>${edit('editProfile','objetivo principal')}</div><p>${esc(s.classGoal||brief.next)}</p></div><div class="student-overview-stat next"><div class="student-overview-stat-head">${icon('calendar')}<strong>Próxima clase</strong></div><p>${esc(nextDate)}${nextTime?`<br>${esc(nextTime)}`:''}</p>${next?button('Preparar','prepare',next.id,'quiet'):button('+ Programar','newSession',s.id,'quiet')}</div><div class="student-overview-stat interests"><div class="student-overview-stat-head">${icon('spark')}<strong>Intereses</strong>${edit('editProfile','intereses')}</div><p>${esc(s.interests||'Añade sus intereses para personalizar actividades.')}</p></div><div class="student-overview-stat reinforce"><div class="student-overview-stat-head">${icon('list')}<strong>A reforzar</strong>${edit('learning','lo que necesita reforzar')}</div><p>${esc(brief.reinforce)}</p></div></div>
  <div class="student-overview-mobile-tabs" role="tablist" aria-label="Información del alumno">${[['notes','Notas'],['tasks','Tareas'],['history','Historial']].map(([id,label])=>`<button data-action="studentOverviewPanel" data-id="${id}" class="${studentOverviewPanel===id?'active':''}" aria-selected="${studentOverviewPanel===id}">${label}</button>`).join('')}</div>
  <div class="student-overview-middle" data-mobile-section="${studentOverviewPanel}"><section class="student-overview-panel student-overview-notes"><div class="student-overview-panel-head"><h2>${icon('file')} Notas</h2>${button('Editar','notes',s.id,'quiet')}</div><p class="prewrap">${esc(s.notes||'Añade aquí observaciones para preparar sus clases.')}</p></section><section class="student-overview-panel student-overview-tasks"><div class="student-overview-panel-head"><h2>${icon('check')} Objetivos y tareas</h2><div>${button('+ Añadir tarea','studentTaskNew',s.id,'primary')}${state.tasks.filter(t=>t.studentId===s.id).length>4?button('Ver todas','pending','','quiet'):''}</div></div><div class="student-overview-task-list">${tasks.map(t=>`<div class="student-overview-task ${t.done?'done':''}"><button class="task-check" data-action="taskToggle" data-id="${esc(t.id)}" aria-label="${t.done?'Reabrir':'Completar'} ${esc(t.title)}">${t.done?'✓':'○'}</button><strong>${esc(t.title)}</strong><span>${t.due?esc(new Date(t.due+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})):'Sin fecha'}</span>${button('✎','taskEdit',t.id,'quiet')}</div>`).join('')||'<p class="student-overview-empty">Todavía no hay tareas. Añade la primera cuando quieras.</p>'}</div></section></div>
  <section class="student-overview-panel student-overview-history"><div class="student-overview-panel-head"><h2>${icon('book')} Historial de clases</h2><div>${button('+ Clase','newSession',s.id,'quiet')}${button('Ver historial','tab','Clases','quiet')}</div></div><div class="student-overview-history-list">${history.map(c=>`<div class="student-overview-history-row"><time>${esc(new Date(c.date).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}))}</time><span class="badge ${subjectColor(c.subject)}">${esc(c.subject)}</span><strong>${esc(c.topic||'Clase sin título')}</strong><span class="student-overview-comment">${esc(c.summary||c.notes||'Sin comentario todavía')}</span>${button('✎','studentHistoryEdit',c.id,'quiet')}</div>`).join('')||'<p class="student-overview-empty">Las clases finalizadas aparecerán aquí.</p>'}</div></section>
 </div>`;
}
function editStudentHistory(id){const c=session(id);if(!c)return;modal('Editar clase',`<label for="historyTopic">Título o contenido</label><input id="historyTopic" name="topic" required maxlength="180" value="${esc(c.topic||'')}"><label for="historyDate">Día y hora</label><input id="historyDate" name="date" type="datetime-local" required value="${esc(c.date)}"><label for="historySubject">Asignatura</label><select id="historySubject" name="subject">${student(c.studentId).subjects.map(x=>`<option ${x===c.subject?'selected':''}>${esc(x)}</option>`).join('')}</select><label for="historySummary">Comentario de la clase</label><textarea id="historySummary" name="summary" maxlength="4000">${esc(c.summary||'')}</textarea>${submit('Guardar clase')}`,f=>{const topic=f.get('topic').trim(),date=f.get('date');if(!topic||!date)throw Error('Indica título y fecha de la clase.');Object.assign(c,{topic,date,subject:f.get('subject'),summary:f.get('summary').trim()});save();render()})}
function renderStudent(){const s=student(selected);if(!s){selected=null;render();return}if(!s.subjects.includes(subject))subject=s.subjects[0];let content='';
 if(tab==='Inicio')content=studentOverviewView(s);
 if(tab==='Progreso'){const brief=learningSummary(s,subject),recent=state.sessions.filter(c=>c.studentId===s.id&&c.subject===subject&&(c.status==='Finalizada'||c.summary)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);content=`<div class="student-progress-layout"><div class="student-progress-main"><section class="card student-progress-focus"><div class="student-progress-focus-item"><span class="progress-focus-icon">◎</span><div><h2>Objetivo actual</h2><p>${esc(s.classGoal||brief.next)}</p></div></div><div class="student-progress-focus-item"><span class="progress-focus-icon amber">▥</span><div><h2>A reforzar</h2><p>${esc(brief.reinforce)}</p></div></div></section><section class="card student-progress-goals"><div class="section-head"><h2>Objetivos de ${esc(subject)}</h2></div>${curriculum[subject]?`<p>Actualiza cada objetivo según lo trabajado en clase.</p>${curriculum[subject].map((o,i)=>`<div class="objective"><span>${esc(o)}</span><select aria-label="Estado: ${esc(o)}" data-progress="${i}">${statusNames.map(v=>`<option ${s.progress[subject+':'+i]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}`:`<p>Para ${esc(subject)} todavía no hay objetivos predefinidos. Usa el resumen de cada clase para anotar los avances de ${esc(s.name)}.</p>${button('Volver al alumno','tab','Inicio','primary')}`}</section></div><aside class="card student-progress-recent"><h2>Evolución reciente</h2>${recent.map(c=>`<div class="progress-recent-item"><time>${esc(new Date(c.date).toLocaleDateString('es-ES',{day:'numeric',month:'short'}))}</time><div><strong>${esc(c.topic||'Clase de '+subject)}</strong><p>${esc(c.summary||c.notes||'Clase finalizada')}</p></div></div>`).join('')||'<p class="muted">Los comentarios de las clases aparecerán aquí.</p>'}</aside></div>`}
 if(tab==='Clases'){const all=state.sessions.filter(c=>c.studentId===s.id&&c.subject===subject).sort((a,b)=>b.date.localeCompare(a.date)),next=upcoming(s.id).find(c=>c.subject===subject),history=all.filter(c=>c.id!==next?.id);content=`<div class="student-classes-layout"><div class="student-classes-main"><section class="card student-next-class"><div class="section-head"><h2>Próxima clase</h2>${button('+ Nueva clase','newSession',s.id,'primary')}</div>${next?sessionCard(next):empty('Todavía no hay una próxima clase programada.')}</section><section class="card student-class-history"><h2>Historial de clases</h2>${history.map(sessionCard).join('')||empty('Las clases realizadas aparecerán aquí.')}</section></div><aside class="card student-class-data"><h2>Datos del alumno</h2><p><strong>Curso</strong><span>${esc(s.course)}</span></p><p><strong>Asignaturas</strong><span>${s.subjects.map(x=>esc(x)).join(' · ')}</span></p><p><strong>Notas</strong><span>${esc(s.notes||'Sin notas todavía')}</span></p></aside></div>`}
 if(tab==='Actividades')content=`<section class="card"><div class="section-head"><h2>Actividades y entregas</h2>${button('Buscar en biblioteca','nav','Biblioteca')}</div>${state.assignments.filter(a=>a.studentId===s.id&&state.library.find(m=>m.id===a.contentId)?.subject===subject).map(a=>`<div class="session"><div class="detail"><h3>${esc(state.library.find(m=>m.id===a.contentId)?.title)}</h3><p>${esc(a.status)}${a.result?' · '+esc(a.result):''}</p></div>${button(a.status==='Entregada'?'Revisar':'Abrir actividad','assignment',a.id)}</div>`).join('')||empty('Asigna materiales de la biblioteca para empezar.')}</section>`;
  if(tab==='Biblioteca')content=`<div class="section-head"><h2>Materiales de ${esc(subject)}</h2>${button('Crear material','workshop','','primary')+button('+ Añadir material','newMaterial')}</div>`+libraryView(s)+`<section class="card student-assignment-summary"><div class="section-head"><h2>Actividades asignadas</h2></div>${state.assignments.filter(a=>a.studentId===s.id&&state.library.find(m=>m.id===a.contentId)?.subject===subject).map(a=>`<div class="session"><div class="detail"><h3>${esc(state.library.find(m=>m.id===a.contentId)?.title)}</h3><p>${esc(a.status)}${a.result?' · '+esc(a.result):''}</p></div>${button(a.status==='Entregada'?'Revisar':'Abrir actividad','assignment',a.id)}</div>`).join('')||empty('Asigna materiales de la biblioteca para empezar.')}</section>`;
 if(tab==='Perfil')content=studentProfileView(s);
 if(tab==='Acceso')content=studentAccessView(s);
 if(tab==='Cobros')content=billingView(s.id);
 $('main').innerHTML=`<div class="workspace-context-link">${button('← Inicio','nav','Inicio','quiet')}</div><div class="topline spacer"><div><div class="eyebrow">ESPACIO DEL ALUMNO</div><h1>${esc(s.name)}</h1></div><select id="subject" class="subject" aria-label="Asignatura">${s.subjects.map(x=>`<option ${x===subject?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${studentSectionNav()}${content}${saveFeedback()}`;wrapWorkspace();if(tab==='Biblioteca')paintMaterialCards($('main'));
}
function modal(title,html,handler){$('dialogTitle').textContent=title;$('form').innerHTML=html;modalHandler=handler;$('dialog').showModal()}
function submit(label='Guardar'){return `<div class="actions"><button type="submit" class="primary">${label}</button>${button('Cancelar','close')}</div>`}
function studentOptions(id){return state.students.map(s=>`<option value="${s.id}" ${s.id===id?'selected':''}>${esc(s.name)}</option>`).join('')}
function newStudent(){modal('Un nuevo camino',`<p>Crea el perfil y elige sus asignaturas. Podrás ajustar cada objetivo desde Progreso.</p><label for="name">Nombre del alumno</label><input id="name" name="name" required maxlength="100" autocomplete="off"><label for="course">Curso</label><select id="course" name="course" required>${courseChoices()}</select><label>Asignaturas y biblioteca inicial</label>${subjects.map((s,i)=>`<label class="check"><input type="checkbox" name="subjects" value="${s}" ${i===0?'checked':''}>${s}</label>`).join('')}${spanishLevelField()}<label for="extraSubject">Otra asignatura (opcional)</label><input id="extraSubject" name="extraSubject" maxlength="80" placeholder="Francés, Tecnología, Música…"><label for="notes">Contexto y observaciones</label><textarea id="notes" name="notes" placeholder="Qué necesita reforzar, objetivos, próximos exámenes…"></textarea>${submit('Crear alumno')}`,f=>{const chosen=f.getAll('subjects');const extra=f.get('extraSubject')?.trim();if(extra&&!chosen.includes(extra))chosen.push(extra);if(!chosen.length)throw Error('Selecciona al menos una asignatura.');const name=f.get('name').trim(),course=f.get('course').trim();if(!name||!course)throw Error('Escribe un nombre y un curso.');const s={id:uid(),name,course,spanishLevel:f.get('spanishLevel')||'A1',subjects:chosen,notes:f.get('notes'),progress:{},materialIds:state.library.filter(m=>chosen.includes(m.subject)).map(m=>m.id)};state.students.push(s);selected=s.id;subject=chosen[0];tab='Inicio';save();render()});document.querySelector('.spanish-level-field').hidden=true;}
function newSession(id){if(!state.students.length){notify('Añade primero un alumno.');newStudent();return}modal('Una nueva clase',`<label for="studentId">Alumno</label><select id="studentId" name="studentId">${studentOptions(id||selected)}</select><div class="field-grid"><div><label for="classSubject">Asignatura</label><select id="classSubject" name="subject"></select></div><div><label for="duration">Duración en minutos</label><input id="duration" name="duration" type="number" min="15" max="180" value="${esc(state.teacherProfile?.defaultDuration||60)}" required></div></div><label for="date">Día y hora</label><input id="date" name="date" type="datetime-local" required value="${localDay()}T17:00"><label for="topic">Tema y objetivo de la sesión</label><input id="topic" name="topic" required maxlength="180" placeholder="Ecuaciones · reforzar cambios de signo"><label for="repeat">Repetir semanalmente</label><select id="repeat" name="repeat"><option value="1">Solo esta clase</option><option value="4">Durante 4 semanas</option><option value="8">Durante 8 semanas</option></select>${submit('Añadir a la agenda')}`,f=>{const date=new Date(f.get('date'));for(let i=0;i<Number(f.get('repeat'));i++){const d=new Date(date);d.setDate(d.getDate()+i*7);state.sessions.push({id:uid(),studentId:f.get('studentId'),subject:f.get('subject'),duration:Number(f.get('duration')),date:localDay(d)+'T'+f.get('date').slice(11),topic:f.get('topic').trim(),status:'Sin preparar',blocks:[],notes:'',summary:''})}save();render()});const update=()=>{$('classSubject').innerHTML=student($('studentId').value).subjects.map(s=>`<option>${esc(s)}</option>`).join('')};$('studentId').addEventListener('change',update);update()}
function prepare(id){const c=session(id);modal('Preparar · '+student(c.studentId).name,`<p>${esc(c.subject)} · ${esc(c.topic)} · ${c.duration} minutos</p>${priorPanel(c)}<div class="actions">${button('Añadir guion base','template',id)}${button('Proponer con IA','generate',id)}${button('+ Bloque','addBlock',id)}</div><div id="blocks">${blocksEditor(c)}</div><label for="reschedule">Día y hora</label><input id="reschedule" type="datetime-local" name="date" required value="${esc(c.date)}"><div class="actions"><button class="primary" type="submit">Guardar preparación</button>${button('Empezar clase →','start',id)}${button('Cancelar clase','cancelSession',id)}</div>`,f=>{readBlocks(c);c.date=f.get('date');c.status=c.blocks.length?'Preparada':'Sin preparar';save();render()})}
function blocksEditor(c){return c.blocks.map((b,i)=>`<div class="block"><div class="row"><strong>Bloque ${i+1}</strong><div class="block-controls">${button('↑','moveUp',b.id)}${button('↓','moveDown',b.id)}${button('×','removeBlock',b.id)}</div></div><label for="title-${b.id}">Título</label><input id="title-${b.id}" data-block-title="${b.id}" value="${esc(b.title)}"><label for="body-${b.id}">Contenido</label><textarea id="body-${b.id}" data-block-body="${b.id}">${esc(b.body)}</textarea><label for="minutes-${b.id}">Minutos</label><input id="minutes-${b.id}" type="number" min="1" max="180" data-block-minutes="${b.id}" value="${b.minutes}"></div>`).join('')||empty('Añade un guion base, escribe tus bloques o pide una propuesta a la IA.')}
function editingSession(){return state.sessions.find(c=>c.blocks.some(b=>$('title-'+b.id)))}
function readBlocks(c){c.blocks.forEach(b=>{if($('title-'+b.id)){b.title=$('title-'+b.id).value;b.body=$('body-'+b.id).value;b.minutes=Math.max(1,Math.min(180,Number($('minutes-'+b.id).value)||5))}})}
function renderClass(){const c=session(activeClass),b=c.blocks[blockIndex];$('main').innerHTML=`<div class="topline"><div><div class="eyebrow">MODO CLASE · ${esc(c.subject)}</div><h1>${esc(student(c.studentId).name)}</h1><p>${esc(c.topic)}</p></div>${button('Guardar y salir','leaveClass')}</div><section class="card"><div class="row"><span class="badge">Bloque ${blockIndex+1} de ${c.blocks.length}</span><span class="muted">${b.minutes} minutos</span></div><h2 class="spacer">${esc(b.title)}</h2><div class="class-content prewrap">${esc(b.body)}</div><div class="actions">${blockIndex?button('← Anterior','previousBlock'):''}${button(blockIndex===c.blocks.length-1?'Completar y cerrar clase':'Completar y continuar →','nextBlock','','primary')}</div></section><section class="card spacer"><label for="classNotes">Notas rápidas · solo para el profesor</label><textarea id="classNotes" placeholder="Dificultades, logros y qué conviene retomar…">${esc(c.notes)}</textarea></section>`}
function finishClass(){const c=session(activeClass);modal('Cerrar la clase',`<p>Guarda lo trabajado y deja contexto para la próxima sesión. El progreso se confirma después, desde la ficha del alumno.</p><label for="summary">Resumen editable</label><textarea id="summary" name="summary" required>${esc(c.summary||`${c.topic}\n${c.blocks.filter(b=>b.done).map(b=>b.title).join(' · ')}\n${c.notes}`)}</textarea><label for="nextFocus">Próximo foco</label><input id="nextFocus" name="nextFocus" placeholder="Qué conviene trabajar a continuación">${submit('Finalizar y guardar')}`,f=>{c.summary=f.get('summary');c.nextFocus=f.get('nextFocus');c.status='Finalizada';if(c.priceCents==null)c.priceCents=student(c.studentId).rateCents??null;student(c.studentId).learning[c.subject]={reinforce:student(c.studentId).learning[c.subject]?.reinforce||''};selected=c.studentId;subject=c.subject;tab='Clases';activeClass=null;save();render()})}
function assign(id){const m=state.library.find(x=>x.id===id);const eligible=state.students.filter(s=>s.subjects.includes(m.subject));if(!eligible.length){notify('Añade un alumno con la asignatura '+m.subject+'.');return}modal('Asignar · '+m.title,`<label for="assignStudent">Alumno</label><select id="assignStudent" name="studentId">${eligible.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label for="due">Fecha de entrega</label><input id="due" name="due" type="date" required value="${localDay()}"><label for="instruction">Indicación individual</label><textarea id="instruction" name="instruction" placeholder="Qué debe practicar este alumno"></textarea>${submit('Asignar actividad')}`,f=>{const s=student(f.get('studentId'));if(!s.materialIds.includes(id))s.materialIds.push(id);state.assignments.push({id:uid(),contentId:id,studentId:s.id,due:f.get('due'),instruction:f.get('instruction'),status:'Pendiente',response:'',feedback:'',result:''});save();render();notify('Actividad asignada a '+s.name)})}
function assignment(id){const a=state.assignments.find(x=>x.id===id),m=state.library.find(x=>x.id===a.contentId);const reviewing=a.status!=='Pendiente';modal(m.title,`<span class="badge">${esc(student(a.studentId).name)} · ${esc(a.status)}</span><p class="prewrap">${esc(m.body)}</p><p>${esc(a.instruction)}</p><p class="muted">Entrega prevista: ${esc(a.due)}. Actividad en sesión con el profesor.</p><label for="response">Respuesta del alumno</label><textarea id="response" name="response" required ${reviewing?'readonly':''}>${esc(a.response)}</textarea>${reviewing?`<label for="feedback">Corrección del profesor</label><textarea id="feedback" name="feedback">${esc(a.feedback)}</textarea><label for="result">Resultado</label><input id="result" name="result" value="${esc(a.result)}" placeholder="Por ejemplo: 5/6 · revisar signos">`:''}${submit(reviewing?'Confirmar corrección':'Registrar entrega')}`,f=>{if(reviewing){a.feedback=f.get('feedback');a.result=f.get('result');a.status='Corregida'}else{a.response=f.get('response');a.status='Entregada';if(m.answer)a.result=a.response.trim().toLocaleLowerCase()===m.answer.trim().toLocaleLowerCase()?'Respuesta correcta · pendiente de revisión':'Revisar respuesta'}save();render()})}
function aiForm(activity=false){if(!state.students.length){newStudent();return}modal(activity?'Crear actividad con contexto':'Preparar clase con contexto',`<label for="aiStudent">Alumno</label><select id="aiStudent" name="studentId">${studentOptions(selected)}</select><label for="aiSubject">Asignatura</label><select id="aiSubject" name="subject"></select><label for="goal">Objetivo concreto</label><textarea id="goal" name="goal" required placeholder="Repasar ecuaciones con paréntesis y cambios de signo"></textarea>${activity?'<label for="aiKind">Formato</label><select id="aiKind" name="kind"><option>Ejercicios</option><option>Test</option><option>Quiz</option><option>Completar</option><option>Encuentra el error</option></select>':'<label for="aiDate">Día y hora de la clase</label><input id="aiDate" name="date" type="datetime-local" required value="'+localDay()+'T17:00">'}${submit('Generar propuesta')}`,async f=>{const s=student(f.get('studentId')),sub=f.get('subject');const text=await askAI(s,sub,f.get('goal'),activity?f.get('kind'):'Clase de 60 minutos');setTimeout(()=>proposal(text,()=>{if(activity){state.library.push({id:uid(),subject:sub,title:f.get('goal').slice(0,100),kind:f.get('kind'),body:$('proposal').value})}else{state.sessions.push({id:uid(),studentId:s.id,subject:sub,date:f.get('date'),duration:60,topic:f.get('goal'),status:'Preparada',blocks:[{id:uid(),title:'Guion validado por el profesor',body:$('proposal').value,minutes:60,done:false}],notes:'',summary:''})}save();render()}),0)});const update=()=>{$('aiSubject').innerHTML=student($('aiStudent').value).subjects.map(x=>`<option>${x}</option>`).join('')};$('aiStudent').addEventListener('change',update);update()}

function searchAll(q){q=q.trim().toLocaleLowerCase();if(!q){$('searchResults').innerHTML='';return}const matches=[...state.students.filter(x=>(x.name+' '+x.course).toLocaleLowerCase().includes(q)).map(x=>({name:x.name,note:'Alumno · '+x.course,action:'student',id:x.id,icon:'users'})),...state.sessions.filter(x=>(x.topic+' '+x.subject+' '+student(x.studentId)?.name).toLocaleLowerCase().includes(q)).map(x=>({name:x.topic,note:student(x.studentId)?.name+' · '+x.date.slice(0,10),action:x.status==='Finalizada'?'summary':'prepare',id:x.id,icon:'calendar'})),...state.library.filter(x=>!x.studentId||(selected&&x.studentId===selected)).filter(x=>(x.title+' '+x.subject).toLocaleLowerCase().includes(q)).map(x=>({name:x.title,note:'Recurso · '+x.subject,action:'material',id:x.id,icon:'book'}))];$('searchResults').innerHTML=matches.slice(0,10).map(x=>button(`${icon(x.icon)}<span>${esc(x.name)}<small>${esc(x.note)}</small></span>`,x.action,x.id)).join('')||empty('No hay resultados para esta búsqueda.')}
function filterLibrary(){materialQuery=$('librarySearch').value.trim();materialSubject=$('librarySubject').value;materialPage=0;$('libraryResults').innerHTML=materialHubCards();$('libraryPager').innerHTML=materialHubPager();paintMaterialCards($('libraryResults'))}

 if(a==='logout'){await saveQueue;if(saveFailed)throw Error('Guarda los cambios pendientes antes de cerrar sesión.');const res=await fetch('/auth/logout',{method:'POST'});if(!res.ok)throw Error('No se ha podido cerrar la sesión.');location.href='/profesor/login'}

const studentCardColors=['mint','lavender','sky','peach','butter','aqua','indigo','stone'];
function normalizeTeacherState(){state.tasks??=[];state.bundles??=[];state.teacherProfile??={subjects:[],headline:'',defaultDuration:60,calendarScale:'week',plan:'normal'};if(!['normal','premium'].includes(state.teacherProfile.plan))state.teacherProfile.plan='normal';state.students.forEach((s,i)=>{s.rateCents??=null;s.learning??={};if(s.subjects.includes('Español'))s.spanishLevel=spanishLevel(s);s.materialIds??=[];s.interests??='';s.classGoal??='';if(!studentCardColors.includes(s.cardColor))s.cardColor=studentCardColors[i%studentCardColors.length]});state.version=2}
function lastLesson(sid,sub,before='9999'){return state.sessions.filter(c=>c.studentId===sid&&(!sub||c.subject===sub)&&c.status==='Finalizada'&&c.date<before).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function learningSummary(s,sub){const last=lastLesson(s.id,sub),manual=s.learning?.[sub]||{};const difficulties=(curriculum[sub]||[]).filter((_,i)=>s.progress[sub+':'+i]==='Reforzar');return {last:manual.last||last?.summary||last?.topic||'Todavía no hay clases registradas.',reinforce:manual.reinforce||difficulties.join(' · ')||'Por concretar en la próxima clase.',next:manual.next||last?.nextFocus||'Define el siguiente objetivo.'}}
function learningPanel(s,sub){const brief=learningSummary(s,sub);return `<section class="learning-panel"><div class="section-head"><h2>El hilo de sus clases</h2>${button('Editar resumen','learning',s.id,'quiet')}</div><div class="learning-grid">${[['Último trabajo',brief.last,'book'],['A reforzar',brief.reinforce,'spark'],['Siguiente paso',brief.next,'arrow']].map(([label,text,ic])=>`<div class="learning-note"><span>${icon(ic)} ${label}</span><p>${esc(text)}</p></div>`).join('')}</div></section>`}
function priorContext(c){const s=student(c.studentId),last=lastLesson(s.id,c.subject,c.date);const brief=learningSummary(s,c.subject);const pending=state.assignments.filter(a=>a.studentId===s.id&&a.status!=='Corregida'&&state.library.find(m=>m.id===a.contentId)?.subject===c.subject);return {last,brief,pending}}
function priorPanel(c){const {last,brief,pending}=priorContext(c);return `<div class="continuity"><span class="badge">Punto de partida</span><h3>${last?'Retoma la última clase':'Prepara el primer paso'}</h3><p class="prewrap">${esc(last?.summary||student(c.studentId).notes||'Añade el contexto del alumno.')}</p><p><strong>A reforzar:</strong> ${esc(brief.reinforce)}</p><p><strong>Continuar con:</strong> ${esc(last?.nextFocus||brief.next)}</p>${pending.length?`<p><strong>Actividades sin cerrar:</strong> ${pending.map(a=>esc(state.library.find(m=>m.id===a.contentId)?.title)).join(' · ')}</p>`:''}</div>`}

function homeAgendaCalendar(){const days=calendarScale==='month'?monthDays():weekDays(),viewMonth=new Date(new Date().getFullYear(),new Date().getMonth()+monthOffset,1).getMonth();return `<div class="home-calendar-head">${calendarScaleSwitch()}<div class="calendar-period-nav">${button('‹','calendarPeriod','-1','quiet')}<strong>${esc(calendarPeriodTitle(days))}</strong>${button('›','calendarPeriod','1','quiet')}</div></div><div class="home-calendar-grid ${calendarScale==='month'?'month':''}">${days.map(d=>{const day=localDay(d),classes=state.sessions.filter(c=>c.date.startsWith(day)&&c.status!=='Cancelada').sort((a,b)=>a.date.localeCompare(b.date));return `<div class="home-calendar-day ${day===localDay()?'today':''} ${calendarScale==='month'&&d.getMonth()!==viewMonth?'outside':''}"><span>${d.toLocaleDateString('es-ES',{weekday:'short'})}<b>${d.getDate()}</b></span>${classes.slice(0,calendarScale==='month'?1:3).map(c=>button(`${esc(c.date.slice(11,16))} ${esc(student(c.studentId)?.name||'Alumno')}`,c.status==='Finalizada'?'summary':'prepare',c.id,'home-calendar-event')).join('')}${classes.length>(calendarScale==='month'?1:3)?`<small>+${classes.length-(calendarScale==='month'?1:3)} clases</small>`:''}</div>`}).join('')}</div>`}
function homeAgendaRow(c){const s=student(c.studentId),date=new Date(c.date),day=date.toLocaleDateString('es-ES',{weekday:'short'}).replace('.',''),month=date.toLocaleDateString('es-ES',{month:'short'}).replace('.','');return `<div class="home-agenda-row"><span class="home-agenda-day"><span class="home-agenda-weekday">${esc(day)}</span><strong class="home-agenda-date">${date.getDate()}</strong><span class="home-agenda-month">${esc(month)}</span></span><span class="home-agenda-time">${esc(c.date.slice(11,16))}</span><span class="home-agenda-detail"><strong>${esc(s?.name||'Alumno')}</strong><small>${esc(c.subject)} · ${esc(s?.course||'')}</small></span>${button('⋮','prepare',c.id,'home-more')}</div>`}
function homeTaskRow(t){const due=t.due?new Date(t.due+'T12:00'):null,today=localDay(),label=due?due.toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.',''):'Sin fecha';return `<div class="home-task-row ${t.done?'completed':''}"><button class="task-check" data-action="taskToggle" data-id="${t.id}" aria-label="${t.done?'Reabrir':'Completar'} ${esc(t.title)}">${t.done?'✓':'○'}</button><span class="home-task-copy"><strong>${esc(t.title)}</strong><small>${t.studentId?esc(student(t.studentId)?.name||'')+(t.priority==='Alta'?' · Prioridad alta':''):t.priority==='Alta'?'Prioridad alta':'Tarea general'}</small></span><button class="home-task-due ${t.due&&t.due<=today?'urgent':''}" data-action="taskEdit" data-id="${t.id}" aria-label="Editar ${esc(t.title)}">${esc(label)}</button></div>`}
function studentCard(s){const sub=s.subjects[0],brief=learningSummary(s,sub),next=upcoming(s.id).find(c=>c.date>=localDay());const mastered=Object.values(s.progress).filter(x=>x==='Dominado').length;return `<article class="student-spotlight"><div class="student-banner"><span class="badge">${esc(s.course)}</span><span class="student-orbit">${icon('book')}</span></div><div class="student-body"><div class="student-identity">${avatar(s)}<div><h3>${esc(s.name)}</h3><span class="muted">${s.subjects.length} ${s.subjects.length===1?'asignatura':'asignaturas'} · ${mastered} ${mastered===1?'objetivo dominado':'objetivos dominados'}</span></div></div><div class="subject-tags">${s.subjects.map(x=>`<span class="badge ${subjectColor(x)}">${esc(x)}</span>`).join('')}</div><div class="student-focus"><span>SIGUIENTE PASO</span><p>${esc(brief.next)}</p></div><div class="student-next">${icon('calendar')}<span>Próxima clase<strong>${next?esc(new Date(next.date).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' · '+next.date.slice(11,16)):'Por programar'}</strong></span></div>${button('Abrir espacio '+icon('arrow'),'student',s.id,'button')}</div></article>`}
function tasksView(limit=100){const rows=state.tasks.filter(t=>!t.done);return `<div class="teacher-tasks">${rows.slice(0,limit).map(t=>`<div class="teacher-task"><button class="task-check" data-action="taskToggle" data-id="${t.id}" aria-label="Completar ${esc(t.title)}">○</button><div><strong>${esc(t.title)}</strong><small>${t.studentId?esc(student(t.studentId)?.name||'')+' · ':''}${t.due?esc(new Date(t.due+'T12:00').toLocaleDateString('es-ES')):'Sin fecha'}${t.priority==='Alta'?' · Prioridad alta':''}</small></div>${button('Editar','taskEdit',t.id,'quiet')}</div>`).join('')||empty('Tu lista, tus prioridades. Añade lo que necesites recordar.')}</div>`}
function taskBoard(){modal('Mis tareas',`<p>Organiza tu trabajo sin depender de recordatorios automáticos.</p><div class="actions">${button('+ Nueva tarea','taskEdit')}</div>${tasksView()}<details class="spacer"><summary>Completadas (${state.tasks.filter(t=>t.done).length})</summary>${state.tasks.filter(t=>t.done).map(t=>`<div class="teacher-task completed"><span>${esc(t.title)}</span>${button('Reabrir','taskToggle',t.id)}</div>`).join('')}</details>`,()=>{})}
function editTask(id,defaultStudentId=''){const t=state.tasks.find(t=>t.id===id);modal(t?'Editar tarea':'Nueva tarea',`<label for="taskTitle">Qué quieres hacer</label><input id="taskTitle" name="title" required maxlength="160" value="${esc(t?.title||'')}" placeholder="Preparar una ficha, llamar a una familia…"><label for="taskStudent">Alumno (opcional)</label><select id="taskStudent" name="studentId"><option value="">Tarea general</option>${studentOptions(t?.studentId||defaultStudentId)}</select><div class="field-grid"><div><label for="taskDue">Fecha (opcional)</label><input id="taskDue" name="due" type="date" value="${esc(t?.due||'')}"></div><div><label for="taskPriority">Prioridad</label><select id="taskPriority" name="priority"><option>Normal</option><option ${t?.priority==='Alta'?'selected':''}>Alta</option></select></div></div>${submit()}${t?`<div class="actions">${button('Subir en la lista','taskUp',t.id)}${button('Bajar en la lista','taskDown',t.id)}${button('Eliminar tarea','taskDelete',t.id)}</div>`:''}`,f=>{const title=f.get('title').trim();if(!title)throw Error('Escribe una tarea.');const data={title,studentId:f.get('studentId'),due:f.get('due'),priority:f.get('priority')};if(t)Object.assign(t,data);else state.tasks.push({id:uid(),done:false,...data});save();render()})}
function templateBlocks(c){const s=student(c.studentId),{last,brief,pending}=priorContext(c);return [{title:'Retomar y comprobar',body:`Objetivo: ${c.topic}\nÚltima clase: ${last?.summary||'Primera sesión.'}\nNotas: ${last?.notes||s.notes||'Sin observaciones.'}\nA reforzar: ${brief.reinforce}\nPendientes: ${pending.map(a=>state.library.find(m=>m.id===a.contentId)?.title).join('; ')||'Sin actividades pendientes.'}`},{title:'Explicación guiada',body:`Partir de: ${last?.nextFocus||brief.next}\nExplica ${c.topic} con un ejemplo resuelto. Comprueba qué pasos puede explicar el alumno sin ayuda.`},{title:'Práctica acompañada',body:`Practica ${c.topic} con dos ejemplos: uno guiado y otro autónomo.\nPresta atención a: ${brief.reinforce}`},{title:'Cierre y próximos pasos',body:'Anota lo que ha podido resolver, qué necesita reforzar y el objetivo de la próxima clase.'}].map((b,i)=>({...b,id:uid(),minutes:Math.floor(c.duration/4)+(i<c.duration%4?1:0),done:false}))}
function materialSubjects(){return [...new Set([...subjects,...state.students.flatMap(s=>s.subjects)])]}
function fileDatabase(){return new Promise((resolve,reject)=>{const req=indexedDB.open('profesor-materials-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(Error('No se puede abrir el almacenamiento de archivos.'))})}
async function storeLocalFile(id,file){const db=await fileDatabase();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(Error('No se ha podido guardar el archivo.'))}})}
async function readLocalFile(id){const db=await fileDatabase();return new Promise((resolve,reject)=>{const tx=db.transaction('files'),req=tx.objectStore('files').get(id);req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(Error('No se puede leer el archivo.'))}})}
async function attachment(file){if(file.size>8*1024*1024)throw Error('Cada archivo puede ocupar hasta 8 MB.');if(!/\.(pdf|docx|png|jpe?g|webp|txt)$/i.test(file.name))throw Error('Usa PDF, DOCX, PNG, JPG, WebP o TXT.');if(demo){const id=uid();await storeLocalFile(id,file);return {id,filename:file.name,size:file.size,local:true}}const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(Error('No se pudo leer el archivo.'));reader.readAsDataURL(file)});return api('/api/profesor/materials',{filename:file.name,base64:data})}
function newMaterial(){modal('Añadir material',`<label for="title">Título</label><input id="title" name="title" required maxlength="180"><label for="materialOwner">Guardar en</label><select id="materialOwner" name="studentId"><option value="">Biblioteca común</option>${studentOptions(selected)}</select><div class="field-grid"><div><label for="materialSubject">Asignatura</label><select id="materialSubject" name="subject">${materialSubjects().map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div><label for="kind">Tipo</label><select id="kind" name="kind">${['Material propio','Explicación','Ejercicios','Test','Quiz','Completar','Encuentra el error'].map(k=>`<option>${k}</option>`).join('')}</select></div></div><label for="body">Notas o instrucciones</label><textarea id="body" name="body"></textarea><label for="materialFile">Adjuntar archivo (opcional)</label><input id="materialFile" type="file" name="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp,.txt"><p class="modal-note">PDF, Word, fotos o texto · hasta 8 MB por archivo.</p><label for="answer">Respuesta exacta para autocorrección (opcional)</label><input id="answer" name="answer">${submit('Guardar material')}`,async f=>{const title=f.get('title').trim(),body=f.get('body').trim(),file=f.get('file');if(!title||(!body&&!file?.size))throw Error('Indica un título y añade contenido o un archivo.');const owner=f.get('studentId');if(owner&&!student(owner).subjects.includes(f.get('subject')))throw Error('Elige una asignatura que tenga ese alumno.');const uploaded=file?.size?await attachment(file):null;const m={id:uid(),title,body,kind:f.get('kind'),subject:f.get('subject'),answer:f.get('answer'),studentId:owner,attachment:uploaded,updatedAt:new Date().toISOString()};state.library.push(m);if(owner)student(owner).materialIds.push(m.id);save();render()});if(selected){$('materialOwner').value=selected;$('materialSubject').value=subject}const update=()=>{const s=student($('materialOwner').value);$('materialSubject').innerHTML=(s?s.subjects:materialSubjects()).map(x=>`<option>${esc(x)}</option>`).join('')};$('materialOwner').addEventListener('change',update);update();if(selected)$('materialSubject').value=subject}
function libraryView(s){const materials=state.library.filter(m=>s?m.subject===subject&&(m.studentId===s.id||s.materialIds.includes(m.id)):!m.studentId);return `<div class="material-hub-grid student-material-grid">${materials.map(m=>materialHubCard(m,true)).join('')||empty('Añade apuntes, fichas o fotos para esta asignatura.')}</div>`}
function openMaterial(id){const m=state.library.find(m=>m.id===id);if(m.activity){showActivityMaterial(m);return}modal(m.title,`<span class="badge">${esc(m.kind)} · ${esc(m.subject)}</span><p class="prewrap">${esc(m.body)}</p>${m.attachment?`<div class="attachment-row">${icon('file')}<span>${esc(m.attachment.filename)}<small>${(m.attachment.size/1024).toFixed(0)} KB</small></span>${button('Descargar','downloadMaterial',m.id,'primary')}</div>`:''}<div class="actions">${button('Cerrar','close')}</div>`,()=>{})}

.payment.amountCents):c.priceCents==null?'Importe por definir':money(c.priceCents)+' pendiente'}</p></div><div class="actions">${c.payment?button('Deshacer cobro','undoPayment',c.id):button('Registrar cobro','payment',c.id,'primary')}</div></div>`).join('')||empty('Las clases finalizadas aparecerán aquí.')}</section>`}

  if(invalid){show(index);invalid.focus();invalid.reportValidity();return false}
  const q=material.activity.questions[index];
  try{validateActivityQuestions([{...q,prompt:$('q-'+index).value,answer:$('a-'+index).value,text:q.type==='reading'?$('text-'+index).value:'',options:optionTypes.includes(q.type)?$('o-'+index).value.split('\n'):[]}]);return true}

}

function puzzleWord(value){return String(value||'').trim().toUpperCase().replaceAll('Ñ','\u0001').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('\u0001','Ñ')}
function puzzleRows(type,options){
 const rows=options.map(value=>String(value).trim()).filter(Boolean);
 if(type==='wordsearch'){
  const words=rows.map(puzzleWord);
  if(words.length<3||words.length>8||words.some(w=>!(/^[A-ZÑ]{3,12}$/).test(w))||new Set(words).size!==words.length)throw Error('Sopa de letras: escribe de 3 a 8 palabras distintas de 3 a 12 letras, una por línea.');
  return words;
 }
 if(type==='pasapalabra'){
  const entries=rows.map(value=>value.split('|').map(part=>part.trim()));
  if(entries.length<3||entries.length>27||entries.some(entry=>entry.length!==3||!(/^[A-ZÑ]$/i).test(entry[0])||!entry[1]||!entry[2]||entry[1].length>180||entry[2].length>60))throw Error('Pasapalabra: escribe de 3 a 27 líneas con el formato LETRA | pista | respuesta.');
  if(new Set(entries.map(entry=>entry[0].toLocaleUpperCase())).size!==entries.length)throw Error('Pasapalabra: cada letra debe aparecer una sola vez.');
  return entries.map(([letter,clue,solution])=>[letter.toLocaleUpperCase(),clue,solution]);
 }
 if(type==='multigaps'){
  if(rows.length<2||rows.length>6||rows.some(value=>value.length>100))throw Error('Texto con huecos: escribe entre 2 y 6 soluciones, una por línea y en el mismo orden que los huecos.');
  return rows;
 }
 const pairs=rows.map(value=>value.split('|').map(part=>part.trim()));
 if(pairs.length<3||pairs.length>(type==='crossword'?7:8)||pairs.some(pair=>pair.length!==2||!pair[0]||!pair[1]))throw Error('Escribe de 3 a '+(type==='crossword'?7:'8')+' líneas con el formato elemento | pista o destino.');
 if(type==='crossword'){
  const words=pairs.map(pair=>puzzleWord(pair[0]));
  if(words.some(w=>!(/^[A-ZÑ]{3,12}$/).test(w))||new Set(words).size!==words.length||pairs.some(pair=>pair[1].length>120))throw Error('Crucigrama: usa palabras distintas de 3 a 12 letras y pistas de hasta 120 caracteres.');
  buildCrossword(words);
 }else if(pairs.some(pair=>pair.some(part=>part.length>100))||new Set(pairs.map(pair=>pair[0].toLocaleLowerCase())).size!==pairs.length)throw Error('Arrastrar: cada elemento debe ser único y tener hasta 100 caracteres.');
 return pairs;
}
function buildWordSearch(words){
 const size=Math.max(10,...words.map(w=>w.length)),grid=Array.from({length:size},()=>Array(size).fill('')),alphabet='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';

 const next=()=>{random=(Math.imul(random,1664525)+1013904223)>>>0;return random};
 const placements=[];
 for(const word of words){
  const candidates=[];for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]])for(let row=0;row<size;row++)for(let col=0;col<size;col++){
   const endRow=row+dr*(word.length-1),endCol=col+dc*(word.length-1);
   if(endRow<0||endRow>=size||endCol<0||endCol>=size)continue;
   const cells=Array.from({length:word.length},(_,i)=>[row+dr*i,col+dc*i]);
   if(cells.every(([r,c],i)=>!grid[r][c]||grid[r][c]===word[i]))candidates.push({word,cells,row,col,endRow,endCol,overlap:cells.filter(([r,c])=>!!grid[r][c]).length});
  }
  candidates.sort((a,b)=>b.overlap-a.overlap||(a.row*size+a.col+seed)%(size*size)-(b.row*size+b.col+seed)%(size*size));
  const placement=candidates[Math.min(next()%Math.min(candidates.length,12),candidates.length-1)];
  if(!placement){const fallback=Array.from({length:size},()=>Array(size).fill(''));const paths=words.map((item,row)=>{const cells=[...item].map((letter,col)=>{fallback[row][col]=letter;return [row,col]});return {word:item,cells,row,col:0,endRow:row,endCol:item.length-1}});for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!fallback[r][c])fallback[r][c]=alphabet[next()%alphabet.length];return {grid:fallback,placements:paths,size}}
  placement.cells.forEach(([r,c],i)=>grid[r][c]=word[i]);placements.push(placement);
 }
 for(let row=0;row<size;row++)for(let col=0;col<size;col++)if(!grid[row][col])grid[row][col]=alphabet[next()%alphabet.length];
 return {grid,placements,size};
}
function buildCrossword(words){
 for(const anchor of [...words].sort((a,b)=>b.length-a.length)){
  const others=words.filter(word=>word!==anchor),used=new Set(),placed=[];
  const assign=index=>{if(index===others.length)return true;const word=others[index];for(let row=0;row<anchor.length;row++){if(used.has(row))continue;for(let col=0;col<word.length;col++){if(word[col]!==anchor[row])continue;used.add(row);placed.push({word,row,col});if(assign(index+1))return true;placed.pop();used.delete(row)}}return false};
  if(!assign(0))continue;
  const left=Math.max(...placed.map(p=>p.col),0),right=Math.max(...placed.map(p=>p.word.length-p.col-1),0),width=left+right+1;
  const grid=Array.from({length:anchor.length},()=>Array(width).fill(''));
  for(let row=0;row<anchor.length;row++)grid[row][left]=anchor[row];
  for(const p of placed)for(let col=0;col<p.word.length;col++)grid[p.row][left-p.col+col]=p.word[col];
  return {grid,anchor,placed,left,width};
 }

}
function puzzlePreview(type,options){try{const rows=puzzleRows(type,options);if(type==='dragdrop')return `<div class="puzzle-preview-list">${rows.map(([item,target])=>`<span>${esc(item)}</span><b>→</b><span>${esc(target)}</span>`).join('')}</div>`;if(type==='pasapalabra')return `<div class="pasapalabra-preview">${rows.map(([letter,clue])=>`<span title="${esc(clue)}">${esc(letter)}</span>`).join('')}</div><small>${rows.length} pistas listas para jugar</small>`;if(type==='multigaps')return `<div class="multi-gap-preview">${rows.map((answer,index)=>`<span><b>${index+1}</b>${esc(answer)}</span>`).join('')}</div>`;const board=type==='wordsearch'?buildWordSearch(rows):buildCrossword(rows.map(pair=>puzzleWord(pair[0])));return `<div class="puzzle-preview-grid" style="--puzzle-size:${board.grid[0].length}">${board.grid.flatMap(row=>row.map(letter=>`<span>${esc(letter)}</span>`)).join('')}</div><small>${type==='wordsearch'?rows.join(' · '):rows.map(pair=>pair[1]).join(' · ')}</small>`}catch(e){return `<p class="puzzle-preview-error">${esc(e.message)}</p>`}}
function puzzleSolution(q){const rows=puzzleRows(q.type,q.options);return q.type==='wordsearch'?rows.join(' · '):q.type==='pasapalabra'?rows.map(([letter,,solution])=>`${letter}: ${solution}`).join(' · '):q.type==='multigaps'?rows.join(' · '):rows.map(pair=>pair.join(' → ')).join(' · ')}
function mountPuzzleGame(q,i,isChecked,report){
 const root=$('puzzle-'+i),answer=$('r-'+i),rows=puzzleRows(q.type,q.options);

  const board=buildWordSearch(rows),found=new Set();let picked=null;
  function draw(){root.innerHTML=`<p class="puzzle-help">Pulsa la primera y la última letra de cada palabra. Puedes usar el teclado.</p><div class="puzzle-grid" style="--puzzle-size:${board.size}">${board.grid.flatMap((row,r)=>row.map((letter,c)=>{const index=r*board.size+c,marked=[...found].some(n=>board.placements[n].cells.some(([pr,pc])=>pr===r&&pc===c));return `<button type="button" data-cell="${index}" class="${marked?'found':''} ${picked===index?'picked':''}" aria-label="Fila ${r+1}, columna ${c+1}, letra ${letter}">${letter}</button>`})).join('')}</div><div class="puzzle-word-list">${rows.map((word,n)=>`<span class="${found.has(n)?'found':''}">${esc(word)}</span>`).join('')}</div>`;
   root.querySelectorAll('[data-cell]').forEach(button=>button.onclick=()=>{if(isChecked())return;const cell=Number(button.dataset.cell);if(picked===null){picked=cell;draw();root.querySelector(`[data-cell="${cell}"]`).focus();return}const chosen=board.placements.findIndex((p,n)=>!found.has(n)&&[[p.row*board.size+p.col,p.endRow*board.size+p.endCol],[p.endRow*board.size+p.endCol,p.row*board.size+p.col]].some(([a,b])=>a===picked&&b===cell));if(chosen>=0)found.add(chosen);picked=null;answer.value=[...found].map(n=>rows[n]).join(', ');report(i,{complete:found.size===rows.length,correct:found.size===rows.length,answer:answer.value});draw();root.querySelector(`[data-cell="${cell}"]`).focus()})}
  draw();return;

  const words=rows.map(pair=>puzzleWord(pair[0])),board=buildCrossword(words),cells=board.grid.flatMap((row,r)=>row.map((letter,c)=>({letter,r,c}))).filter(cell=>cell.letter);
  root.innerHTML=`<p class="puzzle-help">Escribe una letra en cada casilla. La columna azul es la palabra vertical.</p><div class="puzzle-grid" style="--puzzle-size:${board.width}">${board.grid.flatMap((row,r)=>row.map((letter,c)=>letter?`<input class="${c===board.left?'anchor':''}" data-puzzle-cell="${r}-${c}" maxlength="1" autocomplete="off" aria-label="Fila ${r+1}, columna ${c+1}">`:'<span class="blank"></span>')).join('')}</div><ol class="puzzle-clues">${rows.map(([word,clue])=>`<li>${puzzleWord(word)===board.anchor?'↓ vertical':'→ horizontal'} · ${esc(clue)} <small>(${puzzleWord(word).length} letras)</small></li>`).join('')}</ol>`;

function startActivity(m,withStudent=false){if(withStudent){const eligible=state.students.filter(s=>s.subjects.includes(m.subject));if(!eligible.length){notify('Añade un alumno con esta asignatura.');return}modal('Usar en clase',`<p>Trabajaréis desde tu pantalla. No requiere cuenta del alumno.</p><label for="runStudent">Alumno</label><select id="runStudent" name="studentId">${eligible.map(s=>`<option value="${s.id}" ${s.id===(selected||m.studentId)?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${submit('Abrir actividad')}`,f=>{const id=f.get('studentId');setTimeout(()=>runActivity(m,id),0)});return}runActivity(m,'')}
function runActivity(material,studentId){const m=JSON.parse(JSON.stringify(material)),qs=m.activity.questions;const shuffle=xs=>xs.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v);const pairs=shuffle(qs.filter(q=>q.type==='pairs').map(q=>q.answer));let checked=false,attempt=null;const orderLists={},gameStates={};qs.forEach((q,i)=>{if(sequenceTypes.includes(q.type)){orderLists[i]=shuffle(q.options);if(orderLists[i].join(' → ')===q.answer)orderLists[i].reverse()}});modal(studentId?'En clase · '+student(studentId).name:'Prueba · sin guardar',`<h3>${esc(m.title)}</h3>${qs.map((q,i)=>`<section class="block"><label for="r-${i}">${i+1}. ${esc(q.prompt)}</label>${q.type==='reading'?`<div class="reading-passage prewrap">${esc(q.text)}</div>`:''}${visualTypes.includes(q.type)?`<div class="visual-image-box ${q.type==='imagepoint'?'visual-answer-box':''}" id="visual-${i}"><img data-activity-image="${i}" alt="${esc(q.image?.filename||'Imagen del ejercicio')}"></div>`:''}${q.type==='imagepoint'?`<input id="r-${i}" name="r-${i}" type="hidden"><p class="muted">Toca o haz clic en el lugar correcto de la imagen.</p>`:puzzleTypes.includes(q.type)?`<div id="puzzle-${i}"></div><input id="r-${i}" name="r-${i}" type="hidden">`:q.type==='memory'?`<div id="memory-${i}" class="memory-board"></div><input id="r-${i}" name="r-${i}" type="hidden"><p id="memory-status-${i}" role="status"></p>`:q.type==='flashcard'?`<button type="button" id="flip-${i}" class="flash-card" aria-pressed="false">Ver respuesta</button><input id="r-${i}" name="r-${i}" type="hidden">`:sequenceTypes.includes(q.type)?`<p class="muted">Ordena los elementos con las flechas.</p><div id="order-${i}"></div><input type="hidden" id="r-${i}" name="r-${i}">`:openAnswerTypes.includes(q.type)?`<textarea id="r-${i}" name="r-${i}" maxlength="3000" required placeholder="Escribe tu respuesta…"></textarea>`:q.type==='gaps'?`<input id="r-${i}" name="r-${i}" autocomplete="off" maxlength="300" required>`:`<select id="r-${i}" name="r-${i}" required><option value="">Selecciona…</option>${(q.type==='pairs'?pairs:q.type==='boolean'?q.options:shuffle(q.options)).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`}<p id="feedback-${i}" class="prewrap" role="status"></p>${openAnswerTypes.includes(q.type)?`<div id="review-${i}" hidden><label for="grade-${i}">Valoración del profesor</label><select id="grade-${i}"><option value="pending">Pendiente de revisar</option><option value="correct">Correcta</option><option value="incorrect">Necesita revisión</option><option value="partial">Parcialmente correcta</option></select></div>`:''}</section>`).join('')}<p id="activityScore" role="status"></p>${submit('Comprobar respuestas')}`,f=>{if(checked)return false;const answers=qs.map((q,i)=>String(f.get('r-'+i)||''));if(qs.some((q,i)=>puzzleTypes.includes(q.type)&&!gameStates[i]?.complete))throw Error('Termina todas las palabras, casillas o parejas antes de comprobar.');if(answers.some(v=>!v.trim()))throw Error('Completa las respuestas, gira las tarjetas y termina las parejas antes de comprobar.');const norm=v=>v.trim().toLocaleLowerCase().replace(/\s+/g,' ');const grades=qs.map((q,i)=>openAnswerTypes.includes(q.type)?'pending':puzzleTypes.includes(q.type)?gameStates[i].correct?'correct':'incorrect':q.type==='imagepoint'?(() => {const [x,y]=answers[i].split(',').map(Number);return Math.hypot(x-q.target.x,y-q.target.y)<=10?'correct':'incorrect'})():norm(answers[i])===norm(q.answer)?'correct':'incorrect');attempt={id:uid(),materialId:m.id,studentId,date:new Date().toISOString(),mode:'with_teacher',answers,grades,score:0,total:qs.length,pending:0,materialSnapshot:m.activity};qs.forEach((q,i)=>{$('feedback-'+i).textContent=openAnswerTypes.includes(q.type)?'Solución orientativa: '+q.answer:grades[i]==='correct'?'Correcto':'Solución: '+(puzzleTypes.includes(q.type)?puzzleSolution(q):q.type==='imagepoint'?'Punto marcado por el profesor':q.answer);$('r-'+i).disabled=true;if(openAnswerTypes.includes(q.type))$('review-'+i).hidden=false;if(puzzleTypes.includes(q.type))$('puzzle-'+i).querySelectorAll('button,input').forEach(control=>control.disabled=true)});checked=true;Object.keys(orderLists).forEach(i=>renderOrder(Number(i)));if(studentId){state.activityAttempts??=[];state.activityAttempts.push(attempt)}updateScore();$('form').querySelector('[type="submit"]').hidden=true;const close=$('form').querySelector('[data-action="close"]');if(close)close.textContent='Cerrar';return false});$('dialog').classList.add('activity-play');$('dialog').addEventListener('close',()=>$('dialog').classList.remove('activity-play'),{once:true});$('form').querySelectorAll('.block').forEach((block,i)=>block.dataset.tone=materialTone(qs[i].type));function updateScore(){attempt.score=attempt.grades.filter(g=>g==='correct').length;attempt.pending=attempt.grades.filter(g=>g==='pending').length;const partial=attempt.grades.filter(g=>g==='partial').length;$('activityScore').textContent=`${attempt.score}/${attempt.total} correctas.${attempt.pending?' '+attempt.pending+' pendientes de revisión del profesor.':''}${partial?' '+partial+' parcialmente correctas.':''}${studentId?' Sesión registrada con el profesor.':' No se guardan resultados.'}`;if(studentId)save()}function renderOrder(i){$('order-'+i).innerHTML=orderLists[i].map((v,j)=>`<div class="order-row"><span>${j+1}. ${esc(v)}</span><button type="button" data-order="${i}" data-pos="${j}" data-dir="-1" aria-label="Subir paso ${j+1}" ${checked||j===0?'disabled':''}>↑</button><button type="button" data-order="${i}" data-pos="${j}" data-dir="1" aria-label="Bajar paso ${j+1}" ${checked||j===orderLists[i].length-1?'disabled':''}>↓</button></div>`).join('');$('r-'+i).value=orderLists[i].join(' → ');$('order-'+i).querySelectorAll('[data-order]').forEach(btn=>btn.onclick=()=>{const j=Number(btn.dataset.pos),k=j+Number(btn.dataset.dir);[orderLists[i][j],orderLists[i][k]]=[orderLists[i][k],orderLists[i][j]];renderOrder(i)})}Object.keys(orderLists).forEach(i=>renderOrder(Number(i)));paintActivityImages(qs,$('form'));qs.forEach((q,i)=>{if(q.type==='imagepoint'){$('visual-'+i).onclick=e=>{if(checked||e.target.tagName!=='IMG')return;const rect=e.target.getBoundingClientRect(),x=Math.round(100*(e.clientX-rect.left)/rect.width),y=Math.round(100*(e.clientY-rect.top)/rect.height);$('r-'+i).value=x+','+y;const box=$('visual-'+i);box.querySelector('.visual-target-marker')?.remove();box.insertAdjacentHTML('beforeend',`<span class="visual-target-marker" style="left:${x}%;top:${y}%"></span>`)}}if(puzzleTypes.includes(q.type))mountPuzzleGame(q,i,()=>checked,(index,result)=>{gameStates[index]=result});if(q.type==='memory')mountMemory(q,i,()=>checked);if(q.type==='flashcard')$('flip-'+i).onclick=()=>{if(checked)return;const revealed=$('flip-'+i).getAttribute('aria-pressed')!=='true';$('flip-'+i).setAttribute('aria-pressed',String(revealed));$('flip-'+i).textContent=revealed?q.answer:'Ver respuesta';$('r-'+i).value='Tarjeta repasada'}});qs.forEach((q,i)=>{if(openAnswerTypes.includes(q.type))$('grade-'+i).onchange=()=>{if(!attempt)return;attempt.grades[i]=$('grade-'+i).value;updateScore()}})}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const m=state.library.find(x=>x.id===b.dataset.id);if(b.dataset.action==='activityPdf'){downloadActivityPdf(b.dataset.id).catch(error=>notify(error.message));return}if(b.dataset.action==='reviewAttempt')reviewAttempt(b.dataset.id);if(b.dataset.action==='editActivity'&&m)editActivity(m);if(b.dataset.action==='tryActivity'&&m)startActivity(m);if(b.dataset.action==='useActivity'&&m)startActivity(m,true)});


function validateMemory(options){const pairs=options.map(v=>v.split('|').map(x=>x.trim()));if(pairs.some(p=>p.length!==2||p.some(x=>!x||x.length>140))||new Set(pairs.map(p=>p[0].toLocaleLowerCase())).size!==pairs.length||new Set(pairs.map(p=>p[1].toLocaleLowerCase())).size!==pairs.length)throw Error('Memory: escribe de 2 a 8 parejas distintas, con formato concepto | respuesta.');return pairs}
function mountMemory(q,i,isChecked){const pairs=validateMemory(q.options),cards=pairs.flatMap((p,id)=>p.map((label,side)=>({label,id,side}))).sort(()=>Math.random()-.5);let open=[],matched=new Set(),busy=false;const root=$('memory-'+i);function draw(){root.innerHTML=cards.map((c,j)=>`<button type="button" class="memory-card ${matched.has(c.id)?'matched':''}" data-card="${j}" aria-label="${matched.has(c.id)||open.includes(j)?esc(c.label):'Tarjeta '+(j+1)}" ${matched.has(c.id)?'disabled':''}>${matched.has(c.id)||open.includes(j)?esc(c.label):'?'}</button>`).join('');$('memory-status-'+i).textContent=matched.size+' / '+pairs.length+' parejas';root.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.card);if(busy||isChecked()||open.includes(j)||matched.has(cards[j].id))return;open.push(j);if(open.length===2){if(cards[open[0]].id===cards[open[1]].id){matched.add(cards[j].id);open=[];if(matched.size===pairs.length)$('r-'+i).value='Completado'}else{busy=true;setTimeout(()=>{if(!root.isConnected)return;open=[];busy=false;draw()},850)}}draw()})}draw()}
function reviewAttempt(id){const a=state.activityAttempts.find(x=>x.id===id);if(!a)return;const qs=a.materialSnapshot.questions;modal('Respuestas de la sesión',`<p>${esc(student(a.studentId)?.name||'Alumno')} · ${esc(new Date(a.date).toLocaleString('es-ES'))}</p>${qs.map((q,i)=>`<section class="block"><h3>${i+1}. ${esc(q.prompt)}</h3><p class="prewrap"><b>Respuesta:</b> ${esc(a.answers[i])}</p><p class="prewrap"><b>Solución:</b> ${esc(puzzleTypes.includes(q.type)?puzzleSolution(q):q.answer)}</p>${openAnswerTypes.includes(q.type)?`<label for="saved-grade-${i}">Valoración del profesor</label><select id="saved-grade-${i}" name="grade-${i}">${[['pending','Pendiente'],['correct','Correcta'],['partial','Parcialmente correcta'],['incorrect','Necesita revisión']].map(([v,label])=>`<option value="${v}" ${(a.grades?.[i]||'pending')===v?'selected':''}>${label}</option>`).join('')}</select>`:''}</section>`).join('')}${submit('Guardar revisión')}`,f=>{a.grades??=qs.map((q,i)=>a.answers[i].trim().toLocaleLowerCase()===q.answer.trim().toLocaleLowerCase()?'correct':'incorrect');qs.forEach((q,i)=>{if(openAnswerTypes.includes(q.type))a.grades[i]=f.get('grade-'+i)});a.score=a.grades.filter(x=>x==='correct').length;a.pending=a.grades.filter(x=>x==='pending').length;save()})}

init();
</script>
