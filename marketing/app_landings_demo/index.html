<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Educa Suite | Apps de estudio</title>
  <meta name="description" content="Acceso a las cuatro webs de estudio: Universidad +25, ESO Adultos, Cambridge Trainer y Diplomator.">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="/demo-shared.css">
</head>
<body>
  <main class="home-only" aria-label="Apps disponibles">
    <section class="product-grid home-grid">
      <a class="product-card u25" href="/u25">
        <span class="product-head"><span class="mini-logo">U25</span><span class="product-title">Universidad +25</span></span>
        <p>Sesión diaria, materias, examen y progreso.</p>
      </a>
      <a class="product-card e25" href="/e25">
        <span class="product-head"><span class="mini-logo">E25</span><span class="product-title">ESO Adultos</span></span>
        <p>Bloques claros, práctica corta y simulacros.</p>
      </a>
      <a class="product-card cambridge" href="/cambridge-info">
        <span class="product-head"><span class="mini-logo">CAM</span><span class="product-title">Cambridge Trainer</span></span>
        <p>Temas, speaking, writing y feedback.</p>
      </a>
      <a class="product-card diplomator" href="/diplomator">
        <span class="product-head"><span class="mini-logo">DIP</span><span class="product-title">Diplomator</span></span>
        <p>Temas, guion oral, práctica y corrección.</p>
      </a>
